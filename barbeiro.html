<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Painel do Barbeiro — Denner Barbearia</title>
<meta name="theme-color" content="#04060c">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div class="login-wrap" id="login-screen">
  <div class="login-logo">
    <div class="word">DENNER <span class="g">BARBEARIA</span></div>
    <div class="sub">Painel do Barbeiro</div>
  </div>
  <div class="field"><label>Login (e-mail cadastrado)</label><input type="email" id="login-email" placeholder="seu@email.com"></div>
  <div class="field"><label>Senha</label><input type="password" id="login-senha" placeholder="••••••••"></div>
  <button class="btn btn-primary" id="btn-login">ENTRAR</button>
  <button class="btn btn-ghost" id="btn-forgot-password">Esqueci minha senha</button>
  <button class="btn btn-ghost" id="btn-back-site">Voltar para o site</button>
</div>

<!-- ===================== PAINEL ===================== -->
<div class="app-shell hidden" id="barber-shell" style="max-width:480px;padding-bottom:40px;">
  <header class="app-header">
    <div class="brand"><span class="dot"></span> MINHA AGENDA</div>
    <button class="icon-btn" id="btn-logout" aria-label="Sair"><span data-icon="logout"></span></button>
  </header>

  <div class="screen">
    <h1 class="page-title" style="text-align:left;font-size:20px;text-transform:none;margin-top:6px;">Olá, <span class="accent" id="barber-name-label">Barbeiro</span></h1>

    <div class="sidebar-tabs" id="day-tabs" style="padding:0 0 14px;"></div>

    <div class="section-heading" id="agenda-heading">AGENDA DE HOJE</div>
    <div id="barber-agenda"><div class="loader"></div></div>

    <div class="section-heading" style="margin-top:24px;">BLOQUEIOS E FOLGAS</div>
    <div id="barber-blocked-list" style="margin-bottom:10px;"></div>
    <button class="btn btn-secondary" id="btn-add-block">＋ BLOQUEAR HORÁRIO OU FOLGA</button>
  </div>
</div>

<!-- ===================== MODAL: BLOQUEIO ===================== -->
<div class="modal-overlay hidden" id="modal-bloqueio">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h3 class="modal-title">Bloquear Horário</h3>
    <div class="field"><label>Data</label><input type="date" id="bl-data"></div>
    <div class="switch-row"><span>Bloquear o dia inteiro (folga)</span><div class="switch" id="bl-fullday"></div></div>
    <div class="field-row" id="bl-time-row">
      <div class="field"><label>Início</label><input type="time" id="bl-inicio"></div>
      <div class="field"><label>Fim</label><input type="time" id="bl-fim"></div>
    </div>
    <div class="field"><label>Motivo (opcional)</label><input id="bl-motivo" placeholder="Ex: Consulta médica"></div>
    <button class="btn btn-primary btn-block-gap" id="btn-save-bloqueio">SALVAR</button>
    <button class="btn btn-ghost" id="btn-cancel-bloqueio">Cancelar</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>window.FIREBASE_APP_NAME = 'barber-app';</script>
<script src="firebase-config.js"></script>
<script src="utils.js"></script>
<script src="barbeiro.js"></script>
</body>
</html>
